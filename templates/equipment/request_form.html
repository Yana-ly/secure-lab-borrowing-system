{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block breadcrumb %}Borrow Request{% endblock %}
{% block content %}
<div class="mb-4">
    <h1 class="page-title h2 mb-1">{{ title }}</h1>
    <p class="text-muted mb-0">Submit validated borrowing details for available lab equipment.</p>
</div>
<div class="card">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Submit</button>
                <a class="btn btn-outline-secondary" href="{% url 'equipment:request_list' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
