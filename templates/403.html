{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block body %}
<section class="auth-shell">
    <div class="card text-center error-card">
        <div class="card-body py-5">
            <div class="brand-mark mx-auto mb-3"><i class="bi bi-shield-x"></i></div>
            <h1 class="display-6 fw-bold">403 Forbidden</h1>
            <p class="lead text-muted">Access denied. This security event may be recorded in the audit log.</p>
            <a class="btn btn-primary" href="{% url 'equipment:dashboard' %}"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
        </div>
    </div>
</section>
{% endblock %}
